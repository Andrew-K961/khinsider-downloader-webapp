<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />

    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./renderer.js"></script>

    <title>khinsider Downloader GUI</title>
</head>

<body>
    <main class="console">
        <header class="console-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <div class="brand-text">
                    <h1>khinsider <span>downloader</span></h1>
                    <p class="tagline">game soundtrack archive · fetch console</p>
                </div>
            </div>
            <a class="source-link" href="https://downloads.khinsider.com" target="_blank" rel="noopener">downloads.khinsider.com&nbsp;↗</a>
        </header>

        <section class="panel control-panel">
            <form>
                <div class="field">
                    <label for="khlink">khinsider link</label>
                    <input type="url" id="khlink" name="khlink" placeholder="https://downloads.khinsider.com/game-soundtracks/album/…" autocomplete="off">
                </div>
                <div class="field">
                    <label for="downloadDir">download directory</label>
                    <div id="form_inline">
                        <input type="text" id="downloadDir" name="downloadDir" placeholder="/downloads/album" autocomplete="off">
                        <button type="button" id="folderSelectBtn">browse…</button>
                    </div>
                </div>
                <div class="actions">
                    <input type="submit" id="loadBtn" value="Load">
                </div>
            </form>
        </section>

        <div class="status-bar">
            <span class="status-dot" aria-hidden="true"></span>
            <p id="status">Status: Select download folder and khinsider album</p>
        </div>

        <section class="panel track-panel">
            <div class="panel-head">
                <h2>tracks</h2>
            </div>
            <div id="trackList"></div>
        </section>

        <div class="download-row">
            <button id="downloadBtn">Download</button>
        </div>
    </main>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup" id="popup">
            <span class="close" id="closePopup">&times;</span>
            <div class="popup-content">
                <h2 class="popup-title">Select Download Directory</h2>
                <strong id="currentDir" class="current-dir"></strong>
                <div id="fileList">
                    <p class="directory">test</p>
                    <p class="directory">test</p>
                    <p class="directory">test</p>
                    <p class="directory">test</p>
                    <p class="directory">test</p>
                    <p class="directory">test</p>
                </div>
                <div class="popup-actions">
                    <button id="dirSelectedBtn">Select</button>
                    <button id="newDirBtn">New Folder</button>
                    <button id="dirNavUp">Up</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
